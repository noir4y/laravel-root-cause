name: tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: latest
          - php: '8.3'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: latest
          - php: '8.2'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: latest
          - php: '8.3'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: latest
          - php: '8.2'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: lowest
          - php: '8.3'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: lowest
          - php: '8.2'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: lowest
          - php: '8.3'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: lowest

    name: Check / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel_label }} / Testbench ${{ matrix.testbench }} / ${{ matrix.dependency_set }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Resolve dependencies
        env:
          DEPENDENCY_SET: ${{ matrix.dependency_set }}
          LARAVEL_VERSION: ${{ matrix.laravel }}
          TESTBENCH_VERSION: ${{ matrix.testbench }}
        run: ./scripts/resolve-ci-dependencies.sh

      - name: Composer check
        run: composer check

  lint:
    runs-on: ubuntu-latest

    name: Lint / PHP 8.3 / Laravel 12 / Testbench 10 / latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Resolve dependencies
        env:
          DEPENDENCY_SET: latest
          LARAVEL_VERSION: '12'
          TESTBENCH_VERSION: '10'
        run: ./scripts/resolve-ci-dependencies.sh

      - name: Pint
        run: composer lint

  analyse:
    runs-on: ubuntu-latest

    name: Analyse / PHP 8.3 / Laravel 12 / Testbench 10 / latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Resolve dependencies
        env:
          DEPENDENCY_SET: latest
          LARAVEL_VERSION: '12'
          TESTBENCH_VERSION: '10'
        run: ./scripts/resolve-ci-dependencies.sh

      - name: PHPStan
        run: composer analyse

  test:
    runs-on: ubuntu-latest

    name: Test / PHP 8.3 / Laravel 12 / Testbench 10 / latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Resolve dependencies
        env:
          DEPENDENCY_SET: latest
          LARAVEL_VERSION: '12'
          TESTBENCH_VERSION: '10'
        run: ./scripts/resolve-ci-dependencies.sh

      - name: PHPUnit
        run: composer test

  demo-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Demo app smoke
        working-directory: examples/laravel12-demo
        run: |
          composer update --no-interaction --prefer-dist --prefer-stable
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --seed --force
          test "$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class); $request = Illuminate\Http\Request::create("/api/demo/validation-failure", "GET"); $response = $kernel->handle($request); $kernel->terminate($request, $response); echo $response->getStatusCode();')" = "422"
          php artisan root-cause:failed-request >/tmp/root-cause-failed-request.txt
          grep -F 'Root cause: validation_contract_mismatch' /tmp/root-cause-failed-request.txt
