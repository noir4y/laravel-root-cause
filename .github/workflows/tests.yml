name: tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: latest
          - php: '8.3'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: latest
          - php: '8.2'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: latest
          - php: '8.3'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: latest
          - php: '8.2'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: lowest
          - php: '8.3'
            laravel: '11'
            laravel_label: '11'
            testbench: '9'
            dependency_set: lowest
          - php: '8.2'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: lowest
          - php: '8.3'
            laravel: '12'
            laravel_label: '12'
            testbench: '10'
            dependency_set: lowest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel_label }} / Testbench ${{ matrix.testbench }} / ${{ matrix.dependency_set }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Resolve dependencies
        run: |
          FLAGS="--no-interaction --prefer-dist"
          if [ "${{ matrix.dependency_set }}" = "lowest" ]; then
            FLAGS="$FLAGS --prefer-lowest --prefer-stable"
          else
            FLAGS="$FLAGS --prefer-stable"
          fi
          composer update \
            --with illuminate/console:^${{ matrix.laravel }}.0 \
            --with illuminate/contracts:^${{ matrix.laravel }}.0 \
            --with illuminate/database:^${{ matrix.laravel }}.0 \
            --with illuminate/http:^${{ matrix.laravel }}.0 \
            --with illuminate/support:^${{ matrix.laravel }}.0 \
            --with illuminate/validation:^${{ matrix.laravel }}.0 \
            --with orchestra/testbench:^${{ matrix.testbench }}.0 \
            --with-all-dependencies \
            $FLAGS

      - name: Pint
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

  demo-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2

      - name: Demo app smoke
        working-directory: examples/laravel12-demo
        run: |
          composer update --no-interaction --prefer-dist --prefer-stable
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --seed --force
          test "$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class); $request = Illuminate\Http\Request::create("/api/demo/validation-failure", "GET"); $response = $kernel->handle($request); $kernel->terminate($request, $response); echo $response->getStatusCode();')" = "422"
          php artisan root-cause:failed-request >/tmp/root-cause-failed-request.txt
          grep -F 'Root cause: validation_contract_mismatch' /tmp/root-cause-failed-request.txt
